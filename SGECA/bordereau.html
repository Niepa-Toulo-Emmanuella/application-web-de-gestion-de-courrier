<!-- 📄 bordereau.html -->
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bordereau de Transmission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .row {
      margin-bottom: 10px;
    }

    .row label {
      display: inline-block;
      width: 180px;
      font-weight: bold;
    }

    input[readonly],
    textarea[readonly] {
      background-color: #f0f0f0;
      border: 1px solid #ccc;
    }

    textarea.full {
      width: 100%;
    }

    #messageNotif {
      margin-top: 10px;
      font-weight: bold;
      color: green;
    }

    #messageNotif.error {
      color: red;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table,
    th,
    td {
      border: 1px solid #ccc;
    }

    th,
    td {
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
    }

    /* --- Modale Aperçu --- */
    #previewModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #previewContent {
      background: white;
      width: 80%;
      height: 90%;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: none;
    }

    #closePreviewBtn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    tr.urgent {
      background-color: #e0d2d3; /* rouge clair */
      font-weight: bold;
    }

    option.urgent {
      color: red;
      font-weight: bold;
    }
    /* 🔴 Style uniquement pour le texte de la priorité */
    .priorite-urgente {
      color: red;
      font-weight: bold;
    }



  </style>
</head>

<body>
  <div class="container">
    <form id="formulaire-bordereau">
      <h1>ENREGISTREMENT DE BORDEREAU DE COURRIER</h1>

      <div class="row">
        <label>Numéro de bordereau généré :</label>
        <input type="text" id="numero_bordereau" name="numero_bordereau" readonly />
      </div>

      <div class="row">
        <label for="courrier_id">Sélectionner un courrier :</label>
        <select id="courrier_id" name="courrier_id" required>
          <option value="">-- Choisir --</option>
        </select>
      </div>

      <div class="row">
        <label>Pièce jointe du courrier :</label>
        <div id="file-info">Aucun courrier sélectionné</div>
      </div>

      <div class="section">
        <div class="row">
          <label>Expéditeur :</label>
          <input type="text" id="expediteur" name="expediteur" readonly />
        </div>
        <div class="row">
          <label>Référence N° :</label>
          <input type="text" id="reference" name="reference" readonly />
          <label>Date du courrier :</label>
          <input type="date" id="date_reception" name="date_reception" readonly />
        </div>
        <div class="row">
          <label>Date d'arrivée :</label>
          <input type="date" id="date_arrivee" name="date_arrivee" readonly />
          <label>Enregistrement N° :</label>
          <input type="text" id="numero_enregistrement" name="numero_enregistrement" readonly />
          <label>Heure :</label>
          <input type="time" id="heure" name="heure" readonly />
        </div>
        <div class="row">
          <label>Objet :</label>
          <textarea id="objet" name="objet" rows="2" readonly></textarea>
        </div>
      </div>

      <button type="submit" id="envoyerBtn">Enregistrer</button>

      <div id="messageNotif"></div>
      <input type="hidden" id="bordereau_id_hidden" />
    </form>

    <!-- Liste des bordereaux en attente -->
    <h2>Bordereaux en attente</h2>
    <table id="bordereaux-en-attente">
      <thead>
        <tr>
          <th>Numéro</th>
          <th>Objet</th>
          <th>Date arrivée</th>
          <th>Priorité</th> <!-- ✅ ajout visible -->
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ========================= MODALE D’APERÇU ========================= -->
  <div id="previewModal">
    <div id="previewContent">
      <button id="closePreviewBtn">Fermer</button>
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <script>
    const form = document.querySelector('#formulaire-bordereau');
    const numeroBordereauInput = document.getElementById('numero_bordereau');
    const notif = document.getElementById("messageNotif");
    const courrierSelect = document.getElementById("courrier_id");
    const backendUrl = "https://application-web-de-gestion-de-courrier.onrender.com";
    const token = localStorage.getItem("jwt") || localStorage.getItem("token");

    let courriersMap = {};

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch(`${backendUrl}/api/courriers/disponibles`, {
          headers: { Authorization: "Bearer " + token }
        });
        const result = await res.json();

        if (result.success && Array.isArray(result.data)) {
          result.data.forEach(courrier => {
            courriersMap[courrier.id] = courrier;
            const option = document.createElement("option");
            option.value = courrier.id;

            // 🔥 Si le courrier est urgent, afficher clairement le symbole et la couleur
            if (courrier.priorite === "Urgente") {
              option.textContent = `⚠️ [URGENT] ${courrier.reference || 'Réf. inconnue'} - ${courrier.objet || 'Sans objet'}`;
              option.classList.add("urgent"); // pour couleur rouge via CSS
            } else {
              option.textContent = `${courrier.reference || 'Réf. inconnue'} - ${courrier.objet || 'Sans objet'}`;
            }

            courrierSelect.appendChild(option);
          });
        }


        loadBordereauxEnAttente();
      } catch (err) {
        alert("Erreur lors du chargement des courriers. Vérifie la console.");
        console.error(err);
      }
    });

    courrierSelect.addEventListener("change", () => {
      const courrierId = courrierSelect.value;
      const fileInfo = document.getElementById('file-info');

      if (!courrierId) {
        fileInfo.innerHTML = "Aucun courrier sélectionné";
        ['expediteur', 'reference', 'date_reception', 'date_arrivee',
          'numero_enregistrement', 'heure', 'objet'].forEach(id => {
            document.getElementById(id).value = '';
          });
        return;
      }

      const courrier = courriersMap[courrierId];
      if (courrier) {
        // Avertissement visuel si urgent
        const notif = document.getElementById("messageNotif");
        if(courrier.priorite === "Urgente") {
          notif.textContent = "⚠️ Ce bordereau sera urgent !";
          notif.classList.add("error"); // ou "urgent"
        } else {
          notif.textContent = "";
          notif.classList.remove("error");
        }

        document.getElementById('expediteur').value = courrier.expediteur || "";
        document.getElementById('reference').value = courrier.reference || "";
        document.getElementById('date_reception').value = (courrier.date_reception || "").split("T")[0];
        document.getElementById('date_arrivee').value = (courrier.date_arrivee || "").split("T")[0];
        document.getElementById('numero_enregistrement').value = courrier.numero_enregistrement || "";
        document.getElementById('heure').value = courrier.heure || "";
        document.getElementById('objet').value = courrier.objet || "";

        displayFileInfo(courrier.fichier_scan, courrier.id);
      }
    });

    function displayFileInfo(fichierScan, courrierId) {
      const fileInfo = document.getElementById('file-info');
      if (!fichierScan || fichierScan.length === 0) {
        fileInfo.innerHTML = `📄 Aucun fichier attaché`;
        return;
      }

      let fichiers = [];
      if (typeof fichierScan === "string") {
        try {
          const parsed = JSON.parse(fichierScan);
          fichiers = Array.isArray(parsed) ? parsed : [parsed];
        } catch {
          fichiers = [fichierScan];
        }
      } else if (Array.isArray(fichierScan)) {
        fichiers = fichierScan;
      } else {
        fichiers = [fichierScan];
      }

      const links = fichiers.map((url, index) => {
        const fileName = url.split('/').pop();
        return `
      <li>
        <a href="${backendUrl}/api/courriers/secure-download/${courrierId}?index=${index}" target="_blank">
          📄 ${fileName}
        </a>
        <button type="button" onclick="apercuFichier('${courrierId}', ${index})">👁️ Aperçu</button>
      </li>`;
      }).join('');

      fileInfo.innerHTML = `<ul>${links}</ul>`;
    }

    async function apercuFichier(courrierId, index = 0) {
      const iframe = document.getElementById("previewFrame");
      const modal = document.getElementById("previewModal");

      try {
        const res = await fetch(`${backendUrl}/api/courriers/secure-preview/${courrierId}?index=${index}`, {
          headers: { Authorization: "Bearer " + token }
        });

        if (!res.ok) throw new Error("Erreur chargement fichier");

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        console.log("[DEBUG] Aperçu iframe.src =", url);
        iframe.src = url;
        modal.style.display = "flex";

      } catch (err) {
        alert("Impossible d’afficher le fichier. Vérifie la console.");
        console.error(err);
      }
    }

    document.getElementById("closePreviewBtn").addEventListener("click", () => {
      const iframe = document.getElementById("previewFrame");
      const modal = document.getElementById("previewModal");
      iframe.src = "";
      modal.style.display = "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const courrierId = courrierSelect.value;
      if (!courrierId) {
        notif.textContent = "⚠️ Veuillez choisir un courrier.";
        notif.classList.add("error");
        return;
      }

      try {
        const response = await fetch(`${backendUrl}/api/bordereaux`, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            courrier_id: courrierId,
            expediteur_id: 1,
            numero_reference: document.getElementById("reference").value,
            date_courrier: document.getElementById("date_reception").value,
            date_arrivee: document.getElementById("date_arrivee").value,
            numero_enregistrement: document.getElementById("numero_enregistrement").value,
            heure: document.getElementById("heure").value,
            objet: document.getElementById("objet").value,
            priorite: courriersMap[courrierId].priorite // 🔹 ajouté
          })
        });

        const result = await response.json();
        if (result.success) {
          notif.textContent = result.message;
          notif.classList.remove("error");
          notif.classList.add("success");
          numeroBordereauInput.value = result.data.numero;
          loadBordereauxEnAttente();
        } else {
          notif.textContent = result.message || "Erreur lors de l'enregistrement";
          notif.classList.add("error");
        }
      } catch (err) {
        console.error(err);
        notif.textContent = "❌ Erreur serveur";
        notif.classList.add("error");
      }
    });

    async function loadBordereauxEnAttente() {
      try {
        const res = await fetch(`${backendUrl}/api/bordereaux`, {
          headers: { Authorization: "Bearer " + token }
        });
        const result = await res.json();
        const tbody = document.querySelector("#bordereaux-en-attente tbody");
        tbody.innerHTML = "";

        if (result.success && Array.isArray(result.data)) {
          const enAttente = result.data
          .filter(b => b.statut === "en_attente")
          .sort((a, b) => {
            const prio = { "Urgente": 1, "Normale": 2 };
            return prio[a.priorite] - prio[b.priorite]; // Urgentes en haut
          });

          enAttente.forEach(b => {
            const tr = document.createElement("tr");
            
            // Ajout d'une classe CSS pour les urgents
            tr.className = b.priorite === "Urgente" ? "urgent" : "";
            
            tr.innerHTML = `
              <td>${b.numero_reference}</td>
              <td>${b.objet}</td>
              <td>${b.date_arrivee.split("T")[0]}</td>
              <td class="${b.priorite === 'Urgente' ? 'priorite-urgente' : ''}">
                ${b.priorite}
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>

</html>
