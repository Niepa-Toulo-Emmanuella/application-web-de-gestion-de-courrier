<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre des Transcriptions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .files-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        a.file-link {
            color: #007bff;
            text-decoration: none;
            word-break: break-all;
        }

        a.file-link:hover {
            text-decoration: underline;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            display: none;
            margin-top: 20px;
        }

        .table-container {
            overflow-x: auto;
            max-height: 80vh;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h1>📋 Registre des Transcriptions</h1>

    <div class="table-container">
        <table id="tableTranscriptions">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Référence</th>
                    <th>Objet</th>
                    <th>Fichiers Scannés</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="tbodyTranscriptions">
                <tr>
                    <td colspan="5" style="text-align:center;">Chargement...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <iframe id="previewFrame"></iframe>

    <script>
        const API_URL = "https://application-web-de-gestion-de-courrier.onrender.com/api/transcriptions";

        document.addEventListener("DOMContentLoaded", chargerBordereaux);

        async function chargerBordereaux() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                console.log("✅ Réponse API transmissions :", data);
                if (data.success && data.data) {
                    afficherTableau(data.data);
                } else {
                    alert("Erreur de chargement des transcriptions.");
                }
            } catch (error) {
                console.error("Erreur API :", error);
            }
        }

        function afficherTableau(transcriptions) {
            const tbody = document.getElementById("tbodyTranscriptions");
            tbody.innerHTML = "";
            transcriptions.forEach(t => tbody.appendChild(renderRow(t)));
        }

        function renderRow(t) {
            const tr = document.createElement("tr");

            const tdId = document.createElement("td");
            tdId.textContent = t.id;

            const tdRef = document.createElement("td");
            tdRef.textContent = t.reference || "—";

            const tdObjet = document.createElement("td");
            tdObjet.textContent = t.objet || "—";

            const tdDate = document.createElement("td");
            tdDate.textContent = t.date_creation || "—";

            const tdFichiers = document.createElement("td");
            const divFiles = document.createElement("div");
            divFiles.classList.add("files-container");

            try {
                // 📦 Essayer de décoder JSON si c’est une liste
                let fichiers = [];
                if (typeof t.fichier_scan === "string") {
                    if (t.fichier_scan.startsWith("[")) {
                        fichiers = JSON.parse(t.fichier_scan);
                    } else {
                        fichiers = [t.fichier_scan];
                    }
                } else if (Array.isArray(t.fichier_scan)) {
                    fichiers = t.fichier_scan;
                }

                fichiers.forEach(f => {
                    const lien = document.createElement("a");
                    lien.href = f;
                    lien.classList.add("file-link");
                    lien.textContent = f.split("/").pop();
                    lien.target = "_blank";
                    lien.addEventListener("click", e => {
                        e.preventDefault();
                        afficherApercu(f);
                    });
                    divFiles.appendChild(lien);
                });
            } catch (err) {
                console.error("Erreur décodage fichier_scan", err, t.fichier_scan);
                const lien = document.createElement("a");
                lien.href = t.fichier_scan;
                lien.textContent = "Fichier unique";
                lien.target = "_blank";
                divFiles.appendChild(lien);
            }

            tdFichiers.appendChild(divFiles);

            tr.append(tdId, tdRef, tdObjet, tdFichiers, tdDate);
            return tr;
        }

        function afficherApercu(url) {
            const iframe = document.getElementById("previewFrame");
            console.log("📄 Aperçu du fichier :", url);
            iframe.style.display = "block";

            // Gère les PDF / DOCX / XLSX
            if (url.endsWith(".pdf")) {
                iframe.src = url;
            } else if (url.endsWith(".docx") || url.endsWith(".xlsx") || url.endsWith(".pptx")) {
                iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
            } else {
                iframe.src = url;
            }
        }
    </script>
</body>

</html>
