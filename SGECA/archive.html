<!-- archive.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivage des Courriers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: "Segoe UI", sans-serif;
      padding: 40px;
    }

    .card {
      max-width: 650px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 15px;
    }

    .progress {
      height: 20px;
      margin-top: 15px;
    }

    #log {
      margin-top: 20px;
      font-size: 0.95rem;
      white-space: pre-wrap;
      background: #f1f3f4;
      border-radius: 10px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
    }

    .btn-lg {
      width: 100%;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <div class="card p-4">
    <h3 class="text-center mb-3">🗄️ Archivage des Courriers</h3>

    <div class="mb-3">
      <label for="yearSelect" class="form-label">Choisir une année à archiver :</label>
      <select id="yearSelect" class="form-select">
        <script>
          const currentYear = new Date().getFullYear();
          for (let y = currentYear; y >= 2020; y--) {
            document.write(`<option value="${y}">${y}</option>`);
          }
        </script>
      </select>
    </div>

    <div class="d-flex gap-3">
      <button id="btnArchive" class="btn btn-primary btn-lg flex-fill">🚀 Archiver</button>
      <button id="btnDownload" class="btn btn-success btn-lg flex-fill">⬇️ Télécharger l’archive</button>
    </div>

    <div class="progress d-none">
      <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
           role="progressbar" style="width: 0%">0%</div>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const btnArchive = document.getElementById('btnArchive');
    const btnDownload = document.getElementById('btnDownload');
    const progressContainer = document.querySelector('.progress');
    const progressBar = document.getElementById('progressBar');
    const log = document.getElementById('log');
    const yearSelect = document.getElementById('yearSelect');

    function logMessage(message, type = 'info') {
      const emoji = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
      log.textContent += `${emoji} ${message}\n`;
      log.scrollTop = log.scrollHeight;
    }

    // === Fonction 1 : Archiver une année ===
    btnArchive.addEventListener('click', async () => {
      const year = yearSelect.value;
      if (!confirm(`Voulez-vous vraiment archiver les courriers de ${year} ?`)) return;

      btnArchive.disabled = true;
      btnDownload.disabled = true;
      log.textContent = "";
      progressContainer.classList.remove('d-none');
      progressBar.style.width = "0%";
      progressBar.textContent = "0%";

      logMessage(`Début de l’archivage pour l’année ${year}...`);

      try {
        // 🚀 Lancer le job asynchrone
        const launchResponse = await fetch(`/api/archive/launch/${year}`, { method: 'POST' });
        const text = await launchResponse.text();
        console.log("🟢 Réponse brute du lancement :", text);
        let launchData = {};


        try {
          launchData = JSON.parse(text);
          logMessage(`Job lancé : ID ${launchData.run_id}`, 'info');
        } catch {
          logMessage("⚠️ Réponse du serveur vide ou non JSON", "error");
          console.error("Réponse brute :", text);
        }

        // 🔄 Surveiller le statut toutes les 5 secondes
        const interval = setInterval(async () => {
          const statusRes = await fetch(`/api/archive/status/${year}`);
          const statusText = await statusRes.text();
          console.log("🟡 Réponse brute statut :", statusText);


          try {
            status = JSON.parse(statusText);
          } catch {
            logMessage("⚠️ Réponse du serveur non JSON (statut)", "error");
            console.error("Réponse brute :", statusText);
          }

          if (status.status) {
            logMessage(`Statut : ${status.status}, erreurs : ${status.errors_count ?? 0}`, 'info');
          }

          if (status.status === 'done' || status.status === 'error') {
            clearInterval(interval);
            if (status.status === 'done') {
              progressBar.style.width = "100%";
              progressBar.textContent = "100%";
              progressBar.classList.remove("bg-danger");
              progressBar.classList.add("bg-success");
              logMessage(`Archivage terminé ✅`, 'success');
            } else {
              progressBar.classList.add("bg-danger");
              logMessage(`Erreur lors de l’archivage ❌`, 'error');
            }
            btnArchive.disabled = false;
            btnDownload.disabled = false;
          }
        }, 5000);

        // Animation de progression fictive jusqu’au statut final
        let fakeProgress = 0;
        const progressAnim = setInterval(() => {
          fakeProgress = Math.min(90, fakeProgress + 5);
          progressBar.style.width = fakeProgress + "%";
          progressBar.textContent = fakeProgress + "%";
          if (fakeProgress >= 90) clearInterval(progressAnim);
        }, 500);

      } catch (err) {
        progressBar.classList.add("bg-danger");
        logMessage(`Erreur : ${err.message}`, "error");
        btnArchive.disabled = false;
        btnDownload.disabled = false;
      }
    });

    // === Fonction 2 : Télécharger l’archive ZIP via signed URL ===
    btnDownload.addEventListener('click', async () => {
      const year = yearSelect.value;
      logMessage(`Génération du ZIP pour l’année ${year}...`);

      try {
        const resUrl = await fetch(`/api/archive/signed-url/${year}`);
        const text = await resUrl.text();
        console.log("🟣 Réponse brute signed-url :", text);


        try {
          data = JSON.parse(text);
        } catch {
          logMessage("⚠️ Réponse du serveur vide ou non JSON (signed-url)", "error");
          console.error("Réponse brute :", text);
        }

        if (!data.url) throw new Error("Impossible de générer le lien de téléchargement");

        // Ouvrir le lien dans une nouvelle fenêtre pour télécharger
        window.open(data.url);
        logMessage(`Archive ${year} prête au téléchargement 📦`, "success");

      } catch (err) {
        logMessage(`Erreur lors de la génération du ZIP : ${err.message}`, "error");
      }
    });
  </script>
</body>
</html>
