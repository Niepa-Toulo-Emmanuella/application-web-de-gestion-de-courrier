<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivage des Courriers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: "Segoe UI", sans-serif;
      padding: 40px;
    }
    .card {
      max-width: 650px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 15px;
    }
    #log {
      margin-top: 20px;
      font-size: 0.95rem;
      white-space: pre-wrap;
      background: #f1f3f4;
      border-radius: 10px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
    }
    .btn-lg {
      width: 100%;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="card p-4">
    <h3 class="text-center mb-3">🗄️ Archivage des Courriers</h3>

    <div class="mb-3">
      <label for="yearSelect" class="form-label">Choisir une année :</label>
      <select id="yearSelect" class="form-select"></select>
    </div>

    <button id="btnDownload" class="btn btn-success btn-lg">⬇️ Télécharger l’archive</button>

    <div id="log"></div>
  </div>

  <script>
    const API = "https://application-web-de-gestion-de-courrier-1.onrender.com";

    const yearSelect = document.getElementById('yearSelect');
    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= 2020; y--) {
      const option = document.createElement('option');
      option.value = y;
      option.textContent = y;
      yearSelect.appendChild(option);
    }

    const btnDownload = document.getElementById('btnDownload');
    const log = document.getElementById('log');

    function logMessage(message, type='info') {
      const emoji = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
      log.textContent += `${emoji} ${message}\n`;
      log.scrollTop = log.scrollHeight;
    }

    async function safeParseJson(response) {
      const text = await response.text();
      if (!text) return null;
      try { return JSON.parse(text); } 
      catch { return null; }
    }

    // Télécharger l’archive ZIP
    btnDownload.addEventListener('click', async () => {
      const year = yearSelect.value;

      // Vérifie jwt ou token
      const token = localStorage.getItem('jwt') || localStorage.getItem('token');
      if (!token) return alert("⚠️ Vous devez être connecté pour télécharger l’archive.");

      log.textContent = "";
      logMessage(`Génération du ZIP pour l’année ${year}...`);

      try {
        const resUrl = await fetch(`${API}/api/archives/signed-url/${year}`, {
          credentials: "include",
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!resUrl.ok) {
          const errObj = await safeParseJson(resUrl) || { message: resUrl.statusText };
          return logMessage(`Erreur génération lien : ${resUrl.status} ${errObj.message}`, 'error');
        }

        const data = await safeParseJson(resUrl) || {};
        if (!data.url) return logMessage("Aucune URL renvoyée par le serveur.", 'error');

        window.open(data.url);
        logMessage(`Archive ${year} prête au téléchargement`, 'success');

      } catch (err) {
        logMessage(`Erreur lors de la génération du ZIP : ${err.message}`, 'error');
      }
    });
  </script>

</body>
</html>
