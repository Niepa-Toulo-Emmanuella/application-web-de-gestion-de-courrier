<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Notifications reçues</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f5f7fa;
      padding: 40px;
      color: #333;
    }

    h2 {
      color: #00695c;
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
      padding: 12px 15px;
      text-align: left;
    }

    th {
      background: #00695c;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #eef6f4;
    }

    a {
      color: #00796b;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .btn {
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      margin: 2px;
    }

    .btn-imputer {
      background-color: #00796b;
      color: white;
    }

    .btn-imputer:hover {
      background-color: #004d40;
    }

    .btn-preview {
      background-color: #2196f3;
      color: white;
    }

    .btn-preview:hover {
      background-color: #1565c0;
    }

    /* ✅ Fenêtre d’aperçu stylée */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #overlay iframe {
      width: 80%;
      height: 85%;
      border: none;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    #closeOverlay {
      position: absolute;
      top: 20px;
      right: 40px;
      background: #e53935;
      color: white;
      border: none;
      font-size: 16px;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    #closeOverlay:hover {
      background: #b71c1c;
    }
  </style>
</head>

<body>
  <h2>🔔 Notifications reçues</h2>

  <table id="notifTable">
    <thead>
      <tr>
        <th>Numéro</th>
        <th>Objet</th>
        <th>Expéditeur</th>
        <th>Date</th>
        <th>Bordereau</th>
        <th>Courrier</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- ✅ Fenêtre d’aperçu -->
  <div id="overlay">
    <button id="closeOverlay" onclick="closePreview()">Fermer ✖</button>
    <iframe id="previewFrame"></iframe>
  </div>

  <script>
    console.log("✅ Nouvelle version stylée du script chargée");

    async function loadNotifications() {
      const token = localStorage.getItem("token");
      if (!token) return alert("Token manquant");

      try {
        const res = await fetch("https://application-web-de-gestion-de-courrier.onrender.com/api/notifications", {
          headers: { Authorization: "Bearer " + token }
        });
        const data = await res.json();

        const tbody = document.querySelector("#notifTable tbody");
        tbody.innerHTML = "";

        if (data.success && data.data.length > 0) {
          data.data.forEach(n => {
            // 📎 Bordereau
            const bordereauLink = n.fichier_bordereau
              ? `
                <a href="https://application-web-de-gestion-de-courrier.onrender.com/api/bordereaux/download/${encodeURIComponent(n.fichier_bordereau)}" target="_blank">
                  📎 ${n.fichier_bordereau.split('/').pop()}
                </a><br>
                <button class="btn btn-preview" onclick="previewFile('https://application-web-de-gestion-de-courrier.onrender.com/${n.fichier_bordereau}')">👁️ Aperçu</button>
              `
              : "—";

            // 📎 Courriers
            let courrierLink = "—";
            if (n.fichier_scan && Array.isArray(n.fichier_scan) && n.fichier_scan.length > 0) {
              courrierLink = n.fichier_scan.map((url, idx) => {
                const fileName = decodeURIComponent(url.split("/").pop());
                return `
                  <a href="javascript:void(0)" onclick="telecharger(${n.courrier_id}, ${idx}, '${fileName}')">📎 ${fileName}</a>
                  <button class="btn btn-preview" onclick="previewCourrier(${n.courrier_id}, ${idx})">👁️ Aperçu</button>
                `;
              }).join("<br>");
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${n.numero}</td>
              <td>${n.objet || ''}</td>
              <td>${n.first_name || ''} ${n.last_name || ''}</td>
              <td>${new Date(n.date_envoi).toLocaleString()}</td>
              <td>${bordereauLink}</td>
              <td>${courrierLink}</td>
              <td><button class="btn btn-imputer" onclick="imputer('${n.bordereau_id}')">Imputer</button></td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;color:#999;'>Aucune notification reçue</td></tr>";
        }
      } catch (err) {
        console.error("❌ Erreur lors du chargement des notifications :", err);
      }
    }

    // 📩 Télécharger
    async function telecharger(courrierId, index = 0, fileName) {
      const token = localStorage.getItem("token");
      try {
        const res = await fetch(`https://application-web-de-gestion-de-courrier.onrender.com/api/courriers/secure-download/${courrierId}?index=${index}`, {
          headers: { Authorization: "Bearer " + token }
        });
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
      } catch (err) {
        console.error("❌ Erreur telecharger :", err);
      }
    }

    // 👁️ Aperçu
    function previewFile(url) {
      const iframe = document.getElementById("previewFrame");
      if (url.endsWith(".pdf")) iframe.src = url;
      else if (url.endsWith(".docx") || url.endsWith(".xlsx"))
        iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
      else iframe.src = url;
      document.getElementById("overlay").style.display = "flex";
    }

    async function previewCourrier(courrierId, index = 0) {
      const token = localStorage.getItem("token");
      const iframe = document.getElementById("previewFrame");
      try {
        const res = await fetch(`https://application-web-de-gestion-de-courrier.onrender.com/api/courriers/secure-preview/${courrierId}?index=${index}`, {
          headers: { Authorization: "Bearer " + token }
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        if (blob.type.includes("pdf")) iframe.src = url;
        else iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        document.getElementById("overlay").style.display = "flex";
      } catch (err) {
        console.error("❌ Erreur aperçu :", err);
      }
    }

    function closePreview() {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("previewFrame").src = "";
    }

    function imputer(bordereauId) {
      sessionStorage.setItem("bordereau_id", bordereauId);
      window.location.href = "imputation.html";
    }

    loadNotifications();
  </script>
</body>

</html>
