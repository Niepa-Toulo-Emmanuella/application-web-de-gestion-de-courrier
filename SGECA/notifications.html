<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Notifications reçues</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #00695c;
      color: white;
    }

    a {
      text-decoration: none;
      color: #00695c;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      padding: 5px 10px;
      background: #00695c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #004d40;
    }

    /* ✅ Style pour la fenêtre d’aperçu */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #overlay iframe {
      width: 80%;
      height: 90%;
      border: none;
      background: white;
    }

    #closeOverlay {
      position: absolute;
      top: 20px;
      right: 40px;
      background: red;
      color: white;
      border: none;
      font-size: 18px;
      padding: 5px 15px;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h2>🔔 Notifications reçues</h2>

  <table id="notifTable">
    <thead>
      <tr>
        <th>Numéro</th>
        <th>Objet</th>
        <th>Expéditeur</th>
        <th>Date</th>
        <th>Bordereau</th>
        <th>Courrier</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- ✅ Fenêtre d’aperçu -->
  <div id="overlay">
    <button id="closeOverlay" onclick="closePreview()">Fermer ✖</button>
    <iframe id="previewFrame"></iframe>
  </div>

  <script>
    console.log("✅ Nouvelle version du script chargée");

    async function loadNotifications() {
      const token = localStorage.getItem("token");
      if (!token) return alert("Token manquant");

      try {
        const res = await fetch("https://application-web-de-gestion-de-courrier.onrender.com/api/notifications", {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();

        const tbody = document.querySelector("#notifTable tbody");
        tbody.innerHTML = "";

        if (data.success && data.data.length > 0) {
          data.data.forEach(n => {
            console.log("📬 Notification :", n);

            // 📎 Bordereau avec bouton aperçu
            const bordereauLink = n.fichier_bordereau
              ? `
              <a href="https://application-web-de-gestion-de-courrier.onrender.com/api/bordereaux/download/${encodeURIComponent(n.fichier_bordereau)}" target="_blank">
                📎 ${n.fichier_bordereau.split('/').pop()}
              </a><br>
              <button onclick="previewFile('https://application-web-de-gestion-de-courrier.onrender.com/${n.fichier_bordereau}')">👁️ Aperçu</button>
              `
              : "—";

            // 📎 Courriers (multiples fichiers possibles)
            let courrierLink = "—";
            if (n.fichier_scan && Array.isArray(n.fichier_scan) && n.fichier_scan.length > 0) {
              courrierLink = n.fichier_scan.map((url, idx) => {
                const fileName = decodeURIComponent(url.split("/").pop());
                return `
                  <a href="javascript:void(0)" onclick="telecharger(${n.courrier_id}, ${idx}, '${fileName}')">📎 ${fileName}</a>
                  <button onclick="previewCourrier(${n.courrier_id}, ${idx})">👁️ Aperçu</button>
                `;
              }).join("<br>");
            } else if (typeof n.fichier_scan === "string") {
              const fileName = decodeURIComponent(n.fichier_scan.split("/").pop());
              courrierLink = `
                <a href="javascript:void(0)" onclick="telecharger(${n.courrier_id}, 0, '${fileName}')">📎 ${fileName}</a>
                <button onclick="previewCourrier(${n.courrier_id}, 0)">👁️ Aperçu</button>
              `;
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${n.numero}</td>
              <td>${n.objet || ''}</td>
              <td>${n.first_name || ''} ${n.last_name || ''}</td>
              <td>${new Date(n.date_envoi).toLocaleString()}</td>
              <td>${bordereauLink}</td>
              <td>${courrierLink}</td>
              <td><button onclick="imputer('${n.bordereau_id}')">Imputer</button></td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = "<tr><td colspan='7'>Aucune notification reçue</td></tr>";
        }
      } catch (err) {
        console.error("❌ Erreur lors du chargement des notifications :", err);
      }
    }

    // 📩 Télécharger le courrier via le backend
    async function telecharger(courrierId, index = 0, fileName) {
      const token = localStorage.getItem("token");
      if (!token) return alert("Token manquant");

      try {
        const res = await fetch(
          `https://application-web-de-gestion-de-courrier.onrender.com/api/courriers/secure-download/${courrierId}?index=${index}`,
          { headers: { Authorization: "Bearer " + token } }
        );

        if (!res.ok) throw new Error("Erreur téléchargement");

        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        console.error("❌ Erreur telecharger :", err);
        alert("Erreur pendant le téléchargement du fichier");
      }
    }

    // 👁️ Aperçu du fichier de bordereau (fichier public)
    function previewFile(url) {
      const iframe = document.getElementById("previewFrame");
      if (url.endsWith(".pdf")) {
        iframe.src = url;
      } else if (url.endsWith(".docx") || url.endsWith(".xlsx")) {
        iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
      } else {
        iframe.src = url;
      }
      document.getElementById("overlay").style.display = "flex";
    }

    // 👁️ Aperçu du courrier (via endpoint sécurisé)
    async function previewCourrier(courrierId, index = 0) {
      const token = localStorage.getItem("token");
      const iframe = document.getElementById("previewFrame");
      const overlay = document.getElementById("overlay");

      try {
        const res = await fetch(`https://application-web-de-gestion-de-courrier.onrender.com/api/courriers/secure-preview/${courrierId}?index=${index}`, {
          headers: { Authorization: "Bearer " + token }
        });

        if (!res.ok) throw new Error("Erreur chargement du fichier");

        const blob = await res.blob();
        const fileType = blob.type;

        if (fileType.includes("pdf")) {
          iframe.src = URL.createObjectURL(blob);
        } else if (fileType.includes("word") || fileType.includes("officedocument")) {
          const officeUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(URL.createObjectURL(blob))}`;
          iframe.src = officeUrl;
        } else {
          iframe.src = URL.createObjectURL(blob);
        }

        overlay.style.display = "flex";
      } catch (err) {
        console.error("❌ Erreur aperçu :", err);
        alert("Impossible d’afficher un aperçu pour ce fichier");
      }
    }

    // 🔒 Fermer la fenêtre d’aperçu
    function closePreview() {
      const overlay = document.getElementById("overlay");
      const iframe = document.getElementById("previewFrame");
      iframe.src = "";
      overlay.style.display = "none";
    }

    // 🧾 Imputation
    function imputer(bordereauId) {
      sessionStorage.setItem("bordereau_id", bordereauId);
      window.location.href = "imputation.html";
    }

    loadNotifications();
  </script>
</body>

</html>
