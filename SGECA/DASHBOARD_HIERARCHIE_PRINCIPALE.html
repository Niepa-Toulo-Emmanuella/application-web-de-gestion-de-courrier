<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Hiérarchie</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-image: url('login.png');
            /* ✅ Image de fond */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        nav {
            width: 250px;
            background-color: rgba(0, 77, 64, 0.9);
            /* ✅ Couleur avec transparence */
            color: white;
            height: 100vh;
            padding-top: 20px;
        }

        nav h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        nav li:hover {
            background-color: #00695c;
        }

        main {
            flex: 1;
            padding: 30px;
            background-color: rgba(240, 240, 240, 0.9);
            /* ✅ Fond contenu lisible */
        }

        iframe {
            width: 100%;
            height: 90vh;
            border: none;
        }
    </style>
</head>

<body>
    <nav>
        <h2>DASHBORD DU DIRECTEUR DE CABINET</h2>
        <ul>
            <li onclick="loadPage('notifications.html')">🔔 Notifications reçues</li>
            <li onclick="loadPage('imputation.html')">📝 Création de Bordereau d'Imputation </li>
            <li onclick="loadPage('transmettre_bordereau_imputation.html')">📝 Transmission de Bordereau d'Imputation
            </li>
            <li onclick="logout()">🚪 Déconnexion</li>
        </ul>
    </nav>

    <main>
        <iframe id="contentFrame" src=""></iframe>
    </main>

    <script>
        const API_BASE_URL = "https://application-web-de-gestion-de-courrier.onrender.com";
        function loadPage(page) {
            document.getElementById("contentFrame").src = page;
        }

        // function logout() {

        //     localStorage.removeItem("token");
        //     alert("Déconnecté !");
        //     window.location.href = "login.html";
        // }

        async function logout() {
            try {
                // Appel du backend pour supprimer le cookie HttpOnly
                await fetch(`${API_BASE_URL}/api/auth/logout`, {
                    method: 'POST',
                    credentials: 'include' // important pour envoyer le cookie
                });

                // Supprimer les infos du localStorage
                // localStorage.removeItem('token');
                // localStorage.removeItem('userId');
                // localStorage.removeItem('role');

                // Rediriger vers login.html
                window.location.href = 'login.html';
            } catch (err) {
                console.error('Erreur lors de la déconnexion :', err);
                alert('Impossible de se déconnecter. Réessayez.');
            }
        }
    </script>
</body>

</html>
