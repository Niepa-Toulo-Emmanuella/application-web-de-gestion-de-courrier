<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmission de Bordereau</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f9f9f9;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            text-align: center;
        }

        .row {
            margin-bottom: 10px;
        }

        .row label {
            display: inline-block;
            width: 180px;
            font-weight: bold;
        }

        select,
        button {
            padding: 5px;
            width: 250px;
        }

        button {
            cursor: pointer;
            margin-top: 10px;
        }

        #messageNotif {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        #messageNotif.success {
            color: green;
        }

        #messageNotif.error {
            color: red;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table,
        th,
        td {
            border: 1px solid #ccc;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }
        /* 🔴 Style global des urgents */
        .urgent {
            color: red !important;
            font-weight: bold !important;
        }

        /* 🔴 Style pour lignes urgentes des tableaux */
        tr.urgent {
            background-color: #d11414; /* fond rouge clair */
            color: red;
            font-weight: bold;
        }

        /* 🔴 Style pour les options urgentes du select */
        option.urgent {
            color: red;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <div class="container">
        <h1>TRANSMISSION DE BORDEREAU</h1>

        <form id="form-transmission">
            <div class="row">
                <label for="bordereau_id">Sélectionner un bordereau :</label>
                <select id="bordereau_id" name="bordereau_id" required>
                    <option value="">-- Choisir --</option>
                </select>
            </div>

            <div class="row">
                <label for="destinataire_id">Sélectionner le destinataire :</label>
                <select id="destinataire_id" name="destinataire_id" required>
                    <option value="">-- Choisir --</option>
                </select>
            </div>

            <button type="submit">📤 Transmettre</button>
            <div id="messageNotif"></div>
        </form>

        <!-- 🔹 Bordereaux en attente -->
        <h2>Bordereaux en attente</h2>
        <table id="bordereaux-en-attente">
            <thead>
                <tr>
                    <th>Référence</th>
                    <th>N° Enregistrement</th>
                    <th>Objet</th>
                    <th>Date du courrier</th>
                    <th>Date d’arrivée</th>
                    <th>Priorité</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- 🔹 Liste complète -->
        <h2>Liste complète des Bordereaux</h2>
        <table id="bordereauTable" border="1" style="width:100%; border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Référence</th>
                    <th>N° Enregistrement</th>
                    <th>Objet</th>
                    <th>Date du courrier</th>
                    <th>Date d’arrivée</th>
                    <th>Priorité</th>

                </tr>
            </thead>
            <tbody id="bordereauBody"></tbody>
        </table>
    </div>

    <script>
        const API_BASE = "https://application-web-de-gestion-de-courrier.onrender.com/api";
        const form = document.getElementById("form-transmission");
        const bordereauSelect = document.getElementById("bordereau_id");
        const destinataireSelect = document.getElementById("destinataire_id");
        const notif = document.getElementById("messageNotif");

        function parseJwt(token) {
            try {
                if (!token) return {};
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(window.atob(base64));
            } catch {
                return {};
            }
        }

        function showNotif(msg, type = "error") {
            notif.textContent = msg;
            notif.className = type;
        }

        // 🔹 Charger les bordereaux en attente
        async function loadBordereaux() {
            const token = localStorage.getItem("jwt") || localStorage.getItem("token");
            if (!token) {
                showNotif("⚠️ Vous devez vous connecter", "error");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/bordereaux`, {
                    headers: { Authorization: "Bearer " + token }
                });
                const result = await res.json();

                const tbody = document.querySelector("#bordereaux-en-attente tbody");
                tbody.innerHTML = "";
                bordereauSelect.innerHTML = '<option value="">-- Choisir --</option>';

                if (result.success) {
                    const enAttente = result.data.filter(b => b.statut === "en_attente" && b.courrier_id);

                    const formatDate = (d) => d ? new Date(d).toLocaleDateString("fr-FR") : "-";

                    // 🔥 Tri pour mettre les urgents en haut
                    enAttente.sort((a, b) => (b.priorite === "Urgente") - (a.priorite === "Urgente"));

                    enAttente.forEach(b => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
              <td>${b.numero_reference || "-"}</td>
              <td>${b.numero_enregistrement || "-"}</td>
              <td>${b.objet || "-"}</td>
              <td>${formatDate(b.date_courrier)}</td>
              <td>${formatDate(b.date_arrivee)}</td>
              <td class="${b.priorite === 'Urgente' ? 'urgent' : ''}">
                ${b.priorite || 'Normale'}
              </td>
            `;
                        tbody.appendChild(tr);

                        const option = document.createElement("option");
                        option.value = b.id;
                        option.dataset.courrierId = b.courrier_id;
                        // 🆕 Indication visuelle dans la liste
                        if (b.priorite === "Urgente") {
                            option.textContent = `⚠️ [URGENT] ${b.numero_reference || ''} - ${b.objet || ''}`;
                            option.classList.add("urgent"); // ✅ texte rouge et gras
                        } else {
                            option.textContent = `${b.numero_reference || ''} - ${b.objet || ''}`;
                        }
                        bordereauSelect.appendChild(option);
                    });
                }

            } catch (err) {
                console.error("Erreur chargement bordereaux:", err);
                showNotif("❌ Impossible de charger les bordereaux", "error");
            }
        }

        // 🔹 Charger les destinataires
        async function loadDestinataires() {
            try {
                const res = await fetch(`${API_BASE}/users`);
                const result = await res.json();
                destinataireSelect.innerHTML = '<option value="">-- Choisir --</option>';

                if (result.success) {
                    result.data.forEach(u => {
                        if (u.is_active) {
                            const option = document.createElement("option");
                            option.value = u.id;
                            const fullName = `${u.first_name || ''} ${u.last_name || ''}`.trim();
                            const displayName = fullName || u.email;
                            const role = u.role ? u.role.charAt(0).toUpperCase() + u.role.slice(1) : 'Sans rôle';
                            option.textContent = `${displayName} — ${role}`;
                            destinataireSelect.appendChild(option);
                        }
                    });
                }
            } catch (err) {
                console.error("Erreur chargement destinataires:", err);
                showNotif("❌ Impossible de charger les destinataires", "error");
            }
        }

        // 🔹 Transmission
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const selectedOption = bordereauSelect.selectedOptions[0];
            const bordereauId = selectedOption.value;
            const courrierId = selectedOption.dataset.courrierId;
            const destinataireId = destinataireSelect.value;

            const token = localStorage.getItem("jwt") || localStorage.getItem("token");
            const currentUser = parseJwt(token);
            const currentUserId = currentUser.userId || currentUser.id || currentUser.user_id || currentUser.sub;

            if (!courrierId) return showNotif("⚠️ Ce bordereau n'a pas de courrier associé", "error");
            if (!bordereauId || !destinataireId || !currentUserId)
                return showNotif("⚠️ Tous les champs sont obligatoires", "error");

            try {
                const res = await fetch(`${API_BASE}/bordereaux/transmettreBordereau`, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        bordereau_id: bordereauId,
                        destinataire_id: destinataireId,
                        expediteur_id: currentUserId,
                        courrier_id: courrierId
                    })
                });

                const result = await res.json();

                if (res.ok && (result.success || result.message)) {
                    showNotif(result.message || "✅ Transmission réussie", "success");
                    loadBordereaux();
                    chargerBordereaux();
                } else {
                    showNotif(result.message || "❌ Erreur lors de la transmission", "error");
                }
            } catch (err) {
                console.error("Erreur transmission:", err);
                showNotif("❌ Erreur serveur", "error");
            }
        });

        // 🔹 Liste complète des bordereaux
        async function chargerBordereaux() {
            try {
                const token = localStorage.getItem("token") || localStorage.getItem("jwt");
                const res = await fetch(`${API_BASE}/bordereaux`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                const result = await res.json();
                const tbody = document.getElementById("bordereauBody");
                tbody.innerHTML = "";

                if (!result.success || !Array.isArray(result.data)) {
                    tbody.innerHTML = `<tr><td colspan="5">Aucun bordereau trouvé</td></tr>`;
                    return;
                }

                const formatDate = (dateStr) => dateStr ? new Date(dateStr).toLocaleDateString("fr-FR") : "-";

                result.data.forEach(b => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
            <td>${b.numero_reference || "-"}</td>
            <td>${b.numero_enregistrement || "-"}</td>
            <td>${b.objet || "-"}</td>
            <td>${formatDate(b.date_courrier)}</td>
            <td>${formatDate(b.date_arrivee)}</td>
            <td class="${b.priorite === 'Urgente' ? 'urgent' : ''}">
              ${b.priorite || 'Normale'}
            </td>
          `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("Erreur lors du chargement des bordereaux :", err);
                document.getElementById("bordereauBody").innerHTML =
                    `<tr><td colspan="5">Erreur lors du chargement des données</td></tr>`;
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadBordereaux();
            loadDestinataires();
            chargerBordereaux();
        });
    </script>
</body>

</html>
