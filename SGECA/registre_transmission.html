<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registre de transmission</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }

    h2 {
      color: #0d6efd;
    }

    #searchInput {
      max-width: 300px;
    }

    table th {
      white-space: nowrap;
      font-size: 0.9rem;
    }

    table td {
      vertical-align: middle;
      font-size: 0.9rem;
    }

    tbody tr:hover {
      background-color: #eef3ff;
    }

    /* --- Overlay pour l’aperçu --- */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #overlay-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 900px;
      height: 90%;
      display: flex;
      flex-direction: column;
    }

    #closeOverlay {
      align-self: flex-end;
      background: #0d6efd;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    iframe {
      flex-grow: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">📘 Registre de transmission</h2>

    <!-- Barre de recherche -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <input id="searchInput" type="search" class="form-control" placeholder="Rechercher…" />
      <div id="loading" class="ms-3 d-none">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <!-- Alerte -->
    <div id="alert" class="alert alert-danger d-none" role="alert"></div>

    <!-- Tableau -->
    <div class="table-responsive shadow-sm rounded bg-white">
      <table class="table table-striped align-middle text-center" id="table-bordereaux">
        <thead class="table-primary">
          <tr>
            <th>Date</th>
            <th>Référence</th>
            <th>Numéro d’enregistrement</th>
            <th>Objet</th>
            <th>Destinataire</th>
            <th>Observations</th>
            <th>Pièces jointes</th>
            <th>Bordereau d’imputation</th>
            <th>Bordereau</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Aperçu sécurisé -->
  <div id="overlay">
    <div id="overlay-content">
      <button id="closeOverlay">Fermer ✖</button>
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <script>
    const API_BASE = "https://application-web-de-gestion-de-courrier.onrender.com/api";
    const token = localStorage.getItem("token");
    const tbody = document.querySelector("#table-bordereaux tbody");
    const alertBox = document.querySelector("#alert");
    const loadingBox = document.querySelector("#loading");
    const searchInput = document.querySelector("#searchInput");
    const overlay = document.getElementById("overlay");
    const iframe = document.getElementById("previewFrame");

    document.getElementById("closeOverlay").onclick = () => {
      overlay.style.display = "none";
      iframe.src = "";
    };

    // 👁️ Aperçu courrier
    async function previewCourrier(courrierId, index = 0) {
      try {
        const res = await fetch(`${API_BASE}/courriers/secure-preview/${courrierId}?index=${index}`, {
          headers: { Authorization: "Bearer " + token }
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        if (blob.type.includes("pdf"))
          iframe.src = url;
        else
          iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        overlay.style.display = "flex";
      } catch (err) {
        console.error("Erreur aperçu courrier :", err);
        alert("Erreur lors du chargement du courrier.");
      }
    }

    // 👁️ Aperçu bordereau
    function previewBordereauSecure(key) {
      if (!key) return alert("Aucun bordereau à afficher.");
      fetch(`${API_BASE}/bordereaux/secure-preview-by-key`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ key })
      })
        .then(async res => {
          if (!res.ok) throw new Error((await res.json()).message || "Erreur bordereau");
          return res.blob();
        })
        .then(blob => {
          const url = URL.createObjectURL(blob);
          iframe.src = url;
          overlay.style.display = "flex";
        })
        .catch(err => {
          console.error("Erreur aperçu bordereau :", err);
          alert(err.message);
        });
    }

    // 👁️ Aperçu imputation
    function previewImputationSecure(key) {
      if (!key) return alert("Aucun fichier d’imputation à afficher.");
      fetch(`${API_BASE}/imputations/secure-preview-by-key`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ key })
      })
        .then(async res => {
          if (!res.ok) throw new Error((await res.json()).message || "Erreur imputation");
          return res.blob();
        })
        .then(blob => {
          const url = URL.createObjectURL(blob);
          iframe.src = url;
          overlay.style.display = "flex";
        })
        .catch(err => {
          console.error("Erreur aperçu imputation :", err);
          alert(err.message);
        });
    }

    // 🔹 Rendu d'une ligne
    function renderRow(b) {
      const date = b.date_depart
        ? new Date(b.date_depart).toLocaleDateString("fr-FR")
        : "—";

      // ✅ Gestion robuste de fichier_scan
      let fichiersHTML = '—';
      if (b.fichier_scan) {
        try {
          let fichiers = b.fichier_scan;
          if (typeof fichiers === 'string' && fichiers.trim().startsWith('['))
            fichiers = JSON.parse(fichiers);
          else if (typeof fichiers === 'string')
            fichiers = [fichiers];

          if (Array.isArray(fichiers) && fichiers.length > 0) {
            fichiersHTML = fichiers.map((url, i) => `
              <button class="btn btn-sm btn-outline-primary me-1" 
                onclick="previewCourrier('${b.courrier_id}', ${i})">👁️ Voir ${i + 1}</button>`).join('');
          }
        } catch (err) {
          console.warn('Erreur décodage fichier_scan', err, b.fichier_scan);
        }
      }

      const fichierImputation = b.fichier_imputation
        ? `<button class="btn btn-sm btn-outline-primary" onclick="previewImputationSecure('${b.fichier_imputation}')">👁️ Aperçu</button>`
        : "—";

      const fichierBordereau = b.fichier_bordereau
        ? `<button class="btn btn-sm btn-outline-primary" onclick="previewBordereauSecure('${b.fichier_bordereau}')">👁️ Aperçu</button>`
        : "—";

      return `
        <tr>
          <td>${date}</td>
          <td>${b.numero_reference ?? "—"}</td>
          <td>${b.numero_enregistrement ?? "—"}</td>
          <td>${b.objet ?? "—"}</td>
          <td>${b.destinataire ?? "—"}</td>
          <td>${b.observations ?? "—"}</td>
          <td>${fichiersHTML}</td>
          <td>${fichierImputation}</td>
          <td>${fichierBordereau}</td>
        </tr>`;
    }

    // 🔹 Afficher le tableau
    function afficherTableau(data) {
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted fst-italic">Aucun enregistrement trouvé.</td></tr>`;
      } else {
        tbody.innerHTML = data.map(renderRow).join("");
      }
    }

    // 🔹 Filtrer
    function filtrer(data, terme) {
      const t = terme.toLowerCase();
      return data.filter(
        (b) =>
          (b.numero_reference ?? "").toLowerCase().includes(t) ||
          (b.numero_enregistrement ?? "").toLowerCase().includes(t) ||
          (b.objet ?? "").toLowerCase().includes(t) ||
          (b.destinataire ?? "").toLowerCase().includes(t) ||
          (b.observations ?? "").toLowerCase().includes(t)
      );
    }

    // 🔹 Charger les données
    async function chargerBordereaux() {
      alertBox.classList.add("d-none");
      loadingBox.classList.remove("d-none");
      try {
        const res = await fetch(`${API_BASE}/bordereaux/registre-transmission`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { success, data, message } = await res.json();
        if (!success) throw new Error(message ?? "Erreur de chargement");
        window._bordereaux = data;
        afficherTableau(data);
      } catch (err) {
        console.error(err);
        alertBox.textContent = err.message ?? "Erreur serveur";
        alertBox.classList.remove("d-none");
      } finally {
        loadingBox.classList.add("d-none");
      }
    }

    searchInput.addEventListener("input", (e) => {
      const terme = e.target.value.trim();
      afficherTableau(filtrer(window._bordereaux ?? [], terme));
    });

    document.addEventListener("DOMContentLoaded", chargerBordereaux);
  </script>
</body>

</html>
