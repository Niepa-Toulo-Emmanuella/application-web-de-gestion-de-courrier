<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registre de transmission</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }

    h2 {
      color: #0d6efd;
    }

    #searchInput {
      max-width: 300px;
    }

    table th {
      white-space: nowrap;
      font-size: 0.9rem;
    }

    table td {
      vertical-align: middle;
      font-size: 0.9rem;
    }

    tbody tr:hover {
      background-color: #eef3ff;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">📘 Registre de transmission</h2>

    <!-- Barre de recherche -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <input id="searchInput" type="search" class="form-control" placeholder="Rechercher…" />
      <div id="loading" class="ms-3 d-none">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <!-- Alerte -->
    <div id="alert" class="alert alert-danger d-none" role="alert"></div>

    <!-- Tableau -->
    <div class="table-responsive shadow-sm rounded bg-white">
      <table class="table table-striped align-middle text-center" id="table-bordereaux">
        <thead class="table-primary">
          <tr>
            <th>Date</th>
            <th>Référence</th>
            <th>Numéro d’enregistrement</th>
            <th>Objet</th>
            <th>Destinataire</th>
            <th>Observations</th>
            <th>Pièce jointe</th>
            <th>Bordereau d’imputation</th>
            <th>Bordereau</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = "https://application-web-de-gestion-de-courrier.onrender.com";
    const tbody = document.querySelector("#table-bordereaux tbody");
    const alertBox = document.querySelector("#alert");
    const loadingBox = document.querySelector("#loading");
    const searchInput = document.querySelector("#searchInput");

    // 🔹 Rendu d'une ligne
    function renderRow(b) {
      const date = b.date_depart
        ? new Date(b.date_depart).toLocaleDateString("fr-FR")
        : "—";

      // ✅ Gestion robuste de fichier_scan
      let fichiersHTML = '—';
      if (b.fichier_scan) {
        try {
          let fichiers = b.fichier_scan;

          // Si c’est une chaîne JSON valide → on la parse
          if (typeof fichiers === 'string' && fichiers.trim().startsWith('[')) {
            fichiers = JSON.parse(fichiers);
          }
          // Si c’est une chaîne simple → on la met dans un tableau
          else if (typeof fichiers === 'string') {
            fichiers = [fichiers];
          }

          // Générer les boutons
          if (Array.isArray(fichiers) && fichiers.length > 0) {
            fichiersHTML = fichiers.map((url, i) =>
              `<a href="${url}" target="_blank" class="btn btn-sm btn-outline-primary me-1">📎 Voir ${i + 1}</a>`
            ).join('');
          }
        } catch (err) {
          console.warn('Erreur décodage fichier_scan', err, b.fichier_scan);
        }
      }

      const fichierImputation = b.fichier_imputation
        ? `<a href="${b.fichier_imputation}" target="_blank" class="text-decoration-none">📄 Ouvrir</a>`
        : "—";

      // Frontend
      const fichierBordereau = b.fichier_bordereau
        ? `<a href="${b.fichier_bordereau}" target="_blank" class="text-decoration-none">📄 Ouvrir</a>`
        : "—";



      return `
        <tr>
          <td>${date}</td>
          <td>${b.numero_reference ?? "—"}</td>
          <td>${b.numero_enregistrement ?? "—"}</td>
          <td>${b.objet ?? "—"}</td>
          <td>${b.destinataire ?? "—"}</td>
          <td>${b.observations ?? "—"}</td>
          <td>${fichiersHTML}</td>
          <td>${fichierImputation}</td>
          <td>${fichierBordereau}</td>
        </tr>`;
    }

    // 🔹 Afficher le tableau
    function afficherTableau(data) {
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted fst-italic">Aucun enregistrement trouvé.</td></tr>`;
      } else {
        tbody.innerHTML = data.map(renderRow).join("");
      }
    }

    // 🔹 Filtre local
    function filtrer(data, terme) {
      const t = terme.toLowerCase();
      return data.filter(
        (b) =>
          (b.numero_reference ?? "").toLowerCase().includes(t) ||
          (b.numero_enregistrement ?? "").toLowerCase().includes(t) ||
          (b.objet ?? "").toLowerCase().includes(t) ||
          (b.destinataire ?? "").toLowerCase().includes(t) ||
          (b.observations ?? "").toLowerCase().includes(t)
      );
    }

    // 🔹 Charger les données
    async function chargerBordereaux() {
      alertBox.classList.add("d-none");
      loadingBox.classList.remove("d-none");
      try {
        const res = await fetch(`${API_BASE}/api/bordereaux/registre-transmission`, {
          headers: { Authorization: `Bearer ${localStorage.getItem("token")}` },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { success, data, message } = await res.json();
        if (!success) throw new Error(message ?? "Erreur de chargement");
        window._bordereaux = data;
        afficherTableau(data);
      } catch (err) {
        console.error(err);
        alertBox.textContent = err.message ?? "Erreur serveur";
        alertBox.classList.remove("d-none");
      } finally {
        loadingBox.classList.add("d-none");
      }
    }

    // 🔹 Écoute recherche
    searchInput.addEventListener("input", (e) => {
      const terme = e.target.value.trim();
      const data = window._bordereaux ?? [];
      afficherTableau(filtrer(data, terme));
    });

    document.addEventListener("DOMContentLoaded", chargerBordereaux);
  </script>
</body>

</html>
