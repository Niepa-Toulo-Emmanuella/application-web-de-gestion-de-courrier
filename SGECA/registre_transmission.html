<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registre de transmission</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }

    h2 {
      color: #0d6efd;
    }

    #searchInput {
      max-width: 300px;
    }

    table th {
      white-space: nowrap;
      font-size: 0.9rem;
    }

    table td {
      vertical-align: middle;
      font-size: 0.9rem;
    }

    tbody tr:hover {
      background-color: #eef3ff;
    }

    .btn-preview {
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-preview:hover {
      background: #084298;
    }

    /* Overlay pour aperçu */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #overlay-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 900px;
      height: 90%;
      display: flex;
      flex-direction: column;
    }

    #closeOverlay {
      align-self: flex-end;
      background: #0d6efd;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    #previewFrame {
      flex-grow: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">📘 Registre de transmission</h2>

    <!-- Barre de recherche -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <input id="searchInput" type="search" class="form-control" placeholder="Rechercher…" />
      <div id="loading" class="ms-3 d-none">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <!-- Alerte -->
    <div id="alert" class="alert alert-danger d-none" role="alert"></div>

    <!-- Tableau -->
    <div class="table-responsive shadow-sm rounded bg-white">
      <table class="table table-striped align-middle text-center" id="table-bordereaux">
        <thead class="table-primary">
          <tr>
            <th>Date</th>
            <th>Référence</th>
            <th>Numéro d’enregistrement</th>
            <th>Objet</th>
            <th>Destinataire</th>
            <th>Observations</th>
            <th>Priorité</th> <!-- ← Nouvelle colonne -->
            <th>Pièce jointe</th>
            <th>Bordereau d’imputation</th>
            <th>Bordereau</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 🔍 Aperçu (overlay global) -->
  <div id="overlay">
    <div id="overlay-content">
      <button id="closeOverlay">Fermer ✖</button>
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <script>
    const API_BASE = "https://application-web-de-gestion-de-courrier.onrender.com";
    const tbody = document.querySelector("#table-bordereaux tbody");
    const alertBox = document.querySelector("#alert");
    const loadingBox = document.querySelector("#loading");
    const searchInput = document.querySelector("#searchInput");
    const token = localStorage.getItem("token");

    document.getElementById("closeOverlay").onclick = () => {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("previewFrame").src = "";
      console.log("🔒 Overlay fermé");
    };

    function afficherApercuDepuisBlob(blob) {
      const url = URL.createObjectURL(blob);
      const iframe = document.getElementById("previewFrame");
      console.log("🔍 Blob reçu pour aperçu :", blob);
      if (blob.type.includes("pdf")) iframe.src = url;
      else iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
      document.getElementById("overlay").style.display = "flex";
      console.log("👁️ Aperçu affiché dans l'iframe");
    }

    async function previewBordereauSecure(key) {
      console.log("📂 Aperçu bordereau demandé pour key:", key);
      try {
        const res = await fetch(`${API_BASE}/api/bordereaux/secure-preview-by-key`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ key })
        });
        console.log("✅ Réponse API bordereau :", res);
        if (!res.ok) throw new Error("Erreur lors du chargement du bordereau");
        const blob = await res.blob();
        afficherApercuDepuisBlob(blob);
      } catch (err) {
        console.error("❌ Erreur aperçu bordereau :", err);
        alert(err.message);
      }
    }

    async function previewImputationSecure(key) {
      console.log("📂 Aperçu imputation demandé pour key:", key);
      try {
        const res = await fetch(`${API_BASE}/api/imputations/secure-preview-by-key`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ key })
        });
        console.log("✅ Réponse API imputation :", res);
        if (!res.ok) throw new Error("Erreur lors du chargement de l’imputation");
        const blob = await res.blob();
        afficherApercuDepuisBlob(blob);
      } catch (err) {
        console.error("❌ Erreur aperçu imputation :", err);
        alert(err.message);
      }
    }

    function previewCourrier(url) {
      console.log("👁️ Aperçu fichier :", url);
      if (!url) return alert("Aucun fichier à afficher");

      const iframe = document.getElementById("previewFrame");
      if (url.endsWith(".pdf")) {
        iframe.src = url;
      } else if (url.match(/\.(docx|pptx|xlsx)$/)) {
        iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
      } else {
        iframe.src = url;
      }
      document.getElementById("overlay").style.display = "flex";
    }


    function renderRow(b) {
      console.log("🔹 Ligne reçue :", b); // Vérifier tout l'objet

      const date = b.date_depart ? new Date(b.date_depart).toLocaleDateString("fr-FR") : "—";

      // 🔸 Priorité
      let prioriteHTML = b.priorite 
          ? `<span class="badge bg-danger">${b.priorite}</span>` 
          : "—";


      // 🔸 Pièces jointes (courriers)
      let fichiersHTML = '—';
      if (b.fichier_scan) {
        try {
          let fichiers = b.fichier_scan;
          if (typeof fichiers === 'string' && fichiers.trim().startsWith('[')) fichiers = JSON.parse(fichiers);
          else if (typeof fichiers === 'string') fichiers = [fichiers];

          if (Array.isArray(fichiers) && fichiers.length > 0) {
            fichiersHTML = fichiers.map((url) =>
              `<div>
                <a href="${url}" target="_blank" class="text-decoration-none">📎 ${url.split('/').pop()}</a>
                <button class="btn-preview" onclick="previewCourrier('${url}')">👁️ Aperçu</button>
              </div>`
            ).join('');
          }
        } catch (err) {
          console.warn('Erreur décodage fichier_scan', err, b.fichier_scan);
        }
      }

      // 🔸 Imputation
      // 🔸 Imputation (clé relative extraite)
      const fichierImputation = b.fichier_imputation
        ? (() => {
          // On récupère seulement la clé relative dans le bucket
          const key = b.fichier_imputation.split('/CourrierBucket2/')[1];
          return `<div>
            <a href="${b.fichier_imputation}" target="_blank" class="text-decoration-none">Ouvrir</a>
            <button class="btn-preview" onclick="previewImputationSecure('${key}')">Aperçu</button>
          </div>`;
        })()
        : "—";


      // 🔸 Bordereau
      // 🔸 Bordereau (clé relative extraite)
      const fichierBordereau = b.fichier_bordereau
        ? (() => {
          const key = b.fichier_bordereau.split('/CourrierBucket2/')[1];
          return `<div>
            <a href="${b.fichier_bordereau}" target="_blank" class="text-decoration-none">Ouvrir</a>
            <button class="btn-preview" onclick="previewBordereauSecure('${key}')">Aperçu</button>
          </div>`;
        })()
        : "—";


      return `
      <tr>
        <td>${date}</td>
        <td>${b.numero_reference ?? "—"}</td>
        <td>${b.numero_enregistrement ?? "—"}</td>
        <td>${b.objet ?? "—"}</td>
        <td>${Array.isArray(b.destinataire) ? b.destinataire.join(', ') : (b.destinataire ?? "—")}</td>
        <td>${b.observations ?? "—"}</td>
        <td>${prioriteHTML}</td> <!-- ← Nouvelle cellule -->
        <td>${fichiersHTML}</td>
        <td>${fichierImputation}</td>
        <td>${fichierBordereau}</td>
      </tr>`;
    }

    function afficherTableau(data) {
      console.log("📊 Données pour affichage :", data);
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted fst-italic">Aucun enregistrement trouvé.</td></tr>`;
      } else {
        tbody.innerHTML = data.map(renderRow).join("");
      }
    }

    function filtrer(data, terme) {
      const t = terme.toLowerCase();
      return data.filter(
        (b) =>
          (b.numero_reference ?? "").toLowerCase().includes(t) ||
          (b.numero_enregistrement ?? "").toLowerCase().includes(t) ||
          (b.objet ?? "").toLowerCase().includes(t) ||
          (b.destinataire ?? "").toLowerCase().includes(t) ||
          (b.observations ?? "").toLowerCase().includes(t)
      );
    }

    async function chargerBordereaux() {
      alertBox.classList.add("d-none");
      loadingBox.classList.remove("d-none");
      console.log("⏳ Chargement des bordereaux...");
      try {
        const res = await fetch(`${API_BASE}/api/bordereaux/registre-transmission`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        console.log("✅ Réponse API registre-transmission :", res);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { success, data, message } = await res.json();
        if (!success) throw new Error(message ?? "Erreur de chargement");
        window._bordereaux = data;
        afficherTableau(data);
      } catch (err) {
        console.error("❌ Erreur chargement bordereaux :", err);
        alertBox.textContent = err.message ?? "Erreur serveur";
        alertBox.classList.remove("d-none");
      } finally {
        loadingBox.classList.add("d-none");
      }
    }

    searchInput.addEventListener("input", (e) => {
      const terme = e.target.value.trim();
      const data = window._bordereaux ?? [];
      afficherTableau(filtrer(data, terme));
    });

    document.addEventListener("DOMContentLoaded", chargerBordereaux);
  </script>
</body>

</html>
