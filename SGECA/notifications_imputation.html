<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmissions reçues</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }

    h2 {
      color: #00695c;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #00695c;
      color: white;
    }

    td {
      word-break: break-word;
    }

    .center {
      text-align: center;
    }

    tr:hover {
      background-color: #f0f0f0;
      cursor: pointer;
    }

    /* Modal */
    #detailsModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    #modalContentWrapper {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-width: 700px;
      position: relative;
    }

    #closeModal {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
    }

    h3,
    h4 {
      margin-bottom: 10px;
      color: #00695c;
    }

    p {
      margin: 5px 0;
    }

    a.file-link {
      color: #00695c;
      text-decoration: none;
    }

    a.file-link:hover {
      text-decoration: underline;
    }

    .btn-preview {
      background: #00695c;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 4px 8px;
      cursor: pointer;
      margin-left: 10px;
    }

    .btn-preview:hover {
      background: #004d40;
    }
  </style>
</head>

<body>
  <h2>📬 Transmissions reçues</h2>

  <table id="transmissionsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Expéditeur</th>
        <th>Instructions</th>
        <th>Durée (jours)</th>
        <th>Observations</th>
        <th>Date d’envoi</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="6" class="center">Chargement...</td>
      </tr>
    </tbody>
  </table>

  <!-- Modal détails -->
  <div id="detailsModal">
    <div id="modalContentWrapper">
      <span id="closeModal">&times;</span>
      <h3>Détails de la transmission</h3>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- 🔍 Aperçu (Courrier ou Bordereau) -->
  <div id="overlay" style="
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <div style="
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 900px;
      height: 90%;
      display: flex;
      flex-direction: column;
    ">
      <button id="closeOverlay" style="
        align-self: flex-end;
        background: #00695c;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
      ">Fermer ✖</button>
      <iframe id="previewFrame" style="flex-grow: 1; width: 100%; border: none;"></iframe>
    </div>
  </div>

  <script>
    // 🔒 Bouton fermer aperçu
    document.getElementById("closeOverlay").onclick = () => {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("previewFrame").src = "";
    };

    const API_BASE = "https://application-web-de-gestion-de-courrier.onrender.com/api";
    const token = localStorage.getItem("token");

    // 🔽 Téléchargement d’un courrier
    async function telechargerCourrier(courrierId, index = 0, fileName) {
      try {
        const res = await fetch(`${API_BASE}/courriers/secure-download/${courrierId}?index=${index}`, {
          headers: { Authorization: "Bearer " + token }
        });
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        console.error("❌ Erreur téléchargement :", err);
        alert("Erreur lors du téléchargement du fichier.");
      }
    }

    // 👁️ Aperçu d’un courrier
    async function previewCourrier(courrierId, index = 0) {
      const iframe = document.getElementById("previewFrame");
      try {
        const res = await fetch(`${API_BASE}/courriers/secure-preview/${courrierId}?index=${index}`, {
          headers: { Authorization: "Bearer " + token }
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        if (blob.type.includes("pdf")) iframe.src = url;
        else iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        document.getElementById("overlay").style.display = "flex";
      } catch (err) {
        console.error("❌ Erreur aperçu courrier :", err);
      }
    }

    // // 👁️ Aperçu d’un bordereau
    // function previewBordereau(fichierBordereau) {
    //   const iframe = document.getElementById("previewFrame");
    //   iframe.src = `${API_BASE}/bordereaux/secure-preview/${encodeURIComponent(fichierBordereau)}`;
    //   document.getElementById("overlay").style.display = "flex";
    // }

    function previewBordereau(bordereauId) {
      const iframe = document.getElementById("previewFrame");
      iframe.src = `https://application-web-de-gestion-de-courrier.onrender.com/api/bordereaux/secure-preview/${bordereauId}`;
      document.getElementById("overlay").style.display = "flex";
    }




    // 🧾 Détails de la transmission
    function showDetails(t) {
      console.log("🔍 Détails de la transmission sélectionnée :", t); // 🔍 Affiche l'objet complet
      const modal = document.getElementById('detailsModal');
      const content = document.getElementById('modalContent');
      modal.style.display = 'flex';

      const imputationLink = t.fichier_imputation
        ? `${API_BASE}/imputations/download/${encodeURIComponent(t.fichier_imputation)}`
        : null;

      const bordereauLink = t.fichier_bordereau
        ? `${API_BASE}/bordereaux/download/${encodeURIComponent(t.fichier_bordereau)}`
        : null;

      let fichiers = [];
      if (Array.isArray(t.fichier_scan)) {
        fichiers = t.fichier_scan;
      } else if (typeof t.fichier_scan === 'string' && t.fichier_scan.trim() !== '') {
        fichiers = [t.fichier_scan];
      }
      console.log("📄 Fichiers scannés :", fichiers); // 🔍 Affiche les fichiers scannés

      content.innerHTML = `
        <h4>Bordereau d’imputation</h4>
        <p><strong>Instructions :</strong> ${t.instructions || '-'}</p>
        <p><strong>Durée :</strong> ${t.duree_traitement || '-'} jours</p>
        <p><strong>Observations :</strong> ${t.observations || '-'}</p>
        ${imputationLink ? `<p><a class="file-link" href="${imputationLink}" target="_blank">📄 Voir le fichier de l’imputation</a></p>` : ''}

        <h4>Bordereau de transmission</h4>
        <p><strong>Expéditeur :</strong> ${t.expediteur_prenom || ''} ${t.expediteur_nom || ''}</p>
        <p><strong>Destinataire :</strong> ${t.destinataire_prenom || ''} ${t.destinataire_nom || ''}</p>
        ${bordereauLink ? `
          <div class="file-block">
            <a class="file-link" href="${bordereauLink}" target="_blank">📄 Voir le fichier du bordereau</a>
            <button class="btn btn-preview" onclick="previewBordereau('${t.bordereau_id}')">👁️ Aperçu</button>
          </div>

        ` : ''}


        <h4>Courrier</h4>
        <p><strong>Référence :</strong> ${t.courrier_reference || '-'}</p>
        <p><strong>Objet :</strong> ${t.courrier_objet || '-'}</p>

        ${fichiers.length > 0
          ? fichiers.map((fichier, idx) => `
              <div class="file-block">
                <a class="file-link" href="javascript:void(0)" onclick="telechargerCourrier('${t.courrier_id}', ${idx}, '${fichier.split('/').pop()}')">📎 ${fichier.split('/').pop()}</a>
                <button class="btn-preview" onclick="previewCourrier('${t.courrier_id}', ${idx})">👁️ Aperçu</button>
              </div>
            `).join('')
          : '<p>📄 Aucun fichier scanné disponible</p>'
        }
      `;
    }

    document.getElementById('closeModal').onclick = () => {
      document.getElementById('detailsModal').style.display = 'none';
    };

    // 🔄 Chargement des transmissions
    async function loadTransmissions() {
      const tbody = document.querySelector("#transmissionsTable tbody");
      tbody.innerHTML = '<tr><td colspan="6" class="center">Chargement...</td></tr>';

      if (!token) {
        tbody.innerHTML = '<tr><td colspan="6" class="center">⚠️ Veuillez vous connecter</td></tr>';
        return;
      }

      try {
        const user = JSON.parse(atob(token.split('.')[1]));
        const userId = user.userId || user.id;

        const res = await fetch(`${API_BASE}/imputations/transmissions/${userId}`, {
          headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) throw new Error("Erreur HTTP " + res.status);
        const data = await res.json();
        console.log("✅ Réponse API transmissions :", data); // 🔍 Affiche tout ce qui est reçu

        if (data.success && data.data.length > 0) {
          tbody.innerHTML = "";
          data.data.forEach(t => {
            const tr = document.createElement("tr");
            tr.onclick = () => showDetails(t);
            tr.innerHTML = `
              <td>${t.id}</td>
              <td>${t.expediteur_nom || ''} ${t.expediteur_prenom || ''}</td>
              <td>${t.instructions || ''}</td>
              <td>${t.duree_traitement || ''}</td>
              <td>${t.observations || ''}</td>
              <td>${t.date_depart ? new Date(t.date_depart).toLocaleString() : ''}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="6" class="center">Aucune transmission reçue</td></tr>';
        }
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="6" class="center">❌ Erreur réseau</td></tr>';
      }
    }

    window.addEventListener("DOMContentLoaded", loadTransmissions);
  </script>
</body>

</html>
